query questionData($titleSlug: String!) {
    question(titleSlug: $titleSlug) {
        questionId
        frontendQuestionId: questionFrontendId
        title
        titleSlug
        content
        translatedTitle
        translatedContent
        difficulty
        exampleTestcaseList
        codeSnippets {
            lang
            langSlug
            code
        }
    }
}
