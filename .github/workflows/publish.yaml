name: Publish Plugin

# 两种触发方式：
#   1. 推送 v* 标签 → event_name=push    → 构建 + 上传 Marketplace + 创建 Release
#   2. 手动触发        → event_name=workflow_dispatch → 仅构建校验，不发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      plugin-version:
        description: 'Plugin version (e.g. 1.0.22)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 构建工具链与 AGENTS.md 约定一致：JDK 25、Node.js 24（webview 构建需要）
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webview/package-lock.json

      # ---------- 版本号 ----------

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.plugin-version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # 标签版本必须与 gradle.properties 声明一致，避免发错产物
      - name: Check version consistency
        run: |
          declared=$(grep -m1 '^pluginVersion=' gradle.properties | cut -d= -f2)
          if [[ "${{ steps.version.outputs.version }}" != "$declared" ]]; then
            echo "::error::Version mismatch: trigger=${{ steps.version.outputs.version }} gradle.properties=$declared"
            exit 1
          fi

      # ---------- 构建 ----------

      - name: Build plugin
        run: |
          chmod +x gradlew
          ./gradlew buildPlugin

      # ---------- 发布（仅 tag 推送时执行）----------

      - name: Upload to JetBrains Marketplace
        if: github.event_name == 'push'
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
        run: |
          PLUGIN_FILE=$(find build/distributions -name '*.zip' -print -quit)
          echo "Uploading ${PLUGIN_FILE}..."
          curl --fail-with-body -i \
            -F "xmlId=com.yungyu.leetcode-editor" \
            -F "file=@${PLUGIN_FILE}" \
            -H "Authorization: Bearer ${JETBRAINS_TOKEN}" \
            https://plugins.jetbrains.com/plugin/uploadPlugin

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/distributions/*.zip
