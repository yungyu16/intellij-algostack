name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webview/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and build plugin
        run: ./gradlew check buildPlugin verifyPluginProjectConfiguration --console=plain
      - name: Verify platform API compatibility
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew verifyPlugin --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: CodeEpiphany
          path: build/distributions/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier/
